name: BackNewbie Windows Runtime Smoke v4

on:
  push:
    branches:
      - ci/backnewbie-official-001
    paths-ignore:
      - 'ci_backnewbie/results/**'

permissions:
  contents: write

env:
  RESULT_BRANCH: ci/backnewbie-official-001
  RESULT_PATH: ci_backnewbie/results/smoke.txt
  OVERLAY_SHA: c9686979b7de3d492b252498162ce4622d7ab874b5b8ca69ac5e83e9c2d63fac

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout official ClassicUO
        uses: actions/checkout@v4
        with:
          repository: ClassicUO/ClassicUO
          ref: ac6163efe1af6218368026bd67ff4cde54071b96
          submodules: recursive
          fetch-depth: 1
          path: project

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.302

      - name: Build, publish, launch smoke, report
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'LIHACHTETAN/ClienUO-Age-of-Power'
          $project = Join-Path $env:GITHUB_WORKSPACE 'project'
          $client = Join-Path $env:GITHUB_WORKSPACE 'client'
          $lines = [System.Collections.Generic.List[string]]::new()
          $ok = $true
          function Add([string]$s) { $script:lines.Add($s); Write-Host $s }
          function Fail([string]$s) { $script:ok=$false; Add("FAIL: $s") }
          try {
            $blobShas = @(
              'ecb4ac23d65e7f58dba9fd5996c713eba311026b','db024d182e00068e2c7df1c44ad4d161aa39ee7e','2f4c6793d7a7c11a60077f16bc11c7396352cc76','b920ad096f392c9bbf644530be5eef81527f733d','1a74831791b20a2e0d1b8e01a0f899883f67beb2','2b7a7fe3aa878980bfe965f8234eb31ffd0512e9','28f1f34f46943a405dcdd26ae3f57068277d782c','aef071d0c7325303f2c818ddcb9fee547dff5c26','974dfeccb8dec975601c06853deacd6a24c8aecc'
            )
            $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28' }
            $parts=@()
            foreach($sha in $blobShas){
              $o=Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/git/blobs/$sha" -Headers $headers
              $parts += [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String(($o.content -replace '\s','')))
            }
            $archive=Join-Path $env:RUNNER_TEMP 'overlay.tar.gz'
            [IO.File]::WriteAllBytes($archive,[Convert]::FromBase64String(($parts -join '')))
            $hash=(Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if($hash -ne $env:OVERLAY_SHA){ throw "overlay SHA mismatch: $hash" }
            Add("PASS: overlay SHA256 $hash")
            tar -xzf $archive -C $project
            if($LASTEXITCODE -ne 0){ throw "tar exit $LASTEXITCODE" }
            Push-Location $project
            dotnet restore ClassicUO.sln | Out-Host
            if($LASTEXITCODE -ne 0){ throw 'restore failed' }
            dotnet build ClassicUO.sln -c Release --no-restore | Out-Host
            if($LASTEXITCODE -ne 0){ throw 'release build failed' }
            New-Item -ItemType Directory -Path $client -Force | Out-Null
            dotnet publish src/ClassicUO.Bootstrap/src/ClassicUO.Bootstrap.csproj -c Release -o $client /p:OutputType=WinExe | Out-Host
            if($LASTEXITCODE -ne 0){ throw 'bootstrap publish failed' }
            dotnet publish src/ClassicUO.Client/ClassicUO.Client.csproj -c Release -r win-x64 -o $client /p:IS_DEV_BUILD=true /p:NativeLib=Shared /p:OutputType=Library | Out-Host
            if($LASTEXITCODE -ne 0){ throw 'client publish failed' }
            Pop-Location
            foreach($f in @('ClassicUO.exe','cuo.dll','System.Runtime.CompilerServices.Unsafe.dll','System.Memory.dll','System.Buffers.dll')){
              if(-not(Test-Path (Join-Path $client $f))){throw "missing runtime file $f"}
            }
            $uan=[Reflection.AssemblyName]::GetAssemblyName((Join-Path $client 'System.Runtime.CompilerServices.Unsafe.dll'))
            if($uan.Version.ToString() -ne '6.0.0.0'){throw "Unsafe version $($uan.Version)"}
            Add("PASS: Unsafe $($uan.FullName)")

            $psi=[Diagnostics.ProcessStartInfo]::new()
            $psi.FileName=Join-Path $client 'ClassicUO.exe'
            $psi.WorkingDirectory=$client
            $psi.UseShellExecute=$false
            $psi.RedirectStandardOutput=$true
            $psi.RedirectStandardError=$true
            $p=[Diagnostics.Process]::Start($psi)
            $exited=$p.WaitForExit(5000)
            if(-not $exited){
              $p.Kill(); $p.WaitForExit()
              Add('PASS: ClassicUO.exe stayed alive for 5 seconds; no immediate runtime/assembly-load crash')
            } else {
              $stdout=$p.StandardOutput.ReadToEnd(); $stderr=$p.StandardError.ReadToEnd(); $combined=$stdout+"`n"+$stderr
              Add("INFO: ClassicUO.exe exited code=$($p.ExitCode)")
              if($combined -match 'FileNotFoundException|Could not load file or assembly|System\.Runtime\.CompilerServices\.Unsafe'){
                Fail('immediate assembly-load failure: '+(($combined -replace "`r|`n",' ') | Select-Object -First 1))
              } else {
                Add('PASS: no assembly-bind/FileNotFound failure detected during launch')
              }
            }
          } catch {
            Fail(($_ | Out-String).Trim())
          }
          $text = "ClassicUO Official + BackNewbie 001 - WINDOWS RUNTIME SMOKE`nSDK=10.0.302`n" + (($lines) -join "`n") + "`nSMOKE=" + ($(if($ok){'PASS'}else{'FAIL'})) + "`n"
          $encoded=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text))
          $headers=@{Authorization="Bearer $env:GH_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          $uri="https://api.github.com/repos/$repo/contents/$env:RESULT_PATH"
          $sha=$null
          try{$e=Invoke-RestMethod -Uri ($uri+"?ref=$env:RESULT_BRANCH") -Headers $headers;$sha=$e.sha}catch{}
          $payload=@{message='[skip ci] Update Windows runtime smoke result';content=$encoded;branch=$env:RESULT_BRANCH};if($sha){$payload.sha=$sha}
          Invoke-RestMethod -Method Put -Uri $uri -Headers $headers -ContentType 'application/json' -Body ($payload|ConvertTo-Json) | Out-Null
          if(-not $ok){exit 1}
