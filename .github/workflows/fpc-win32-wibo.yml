name: FPC Native Test Toolchain

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Pull FPC 3.2.2 native Linux image
        run: docker pull signumtemporis/fpc:3.2.2-full

      - name: Verify native Pascal execution
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/fpc-smoke"
          cat > "$RUNNER_TEMP/fpc-smoke/hello.pas" <<'PAS'
          program hello;
          begin
            WriteLn('FPC 3.2.2 native execution OK');
          end.
          PAS
          docker run --rm \
            -v "$RUNNER_TEMP/fpc-smoke:/workspace" \
            signumtemporis/fpc:3.2.2-full \
            hello.pas
          test -x "$RUNNER_TEMP/fpc-smoke/hello"
          "$RUNNER_TEMP/fpc-smoke/hello" | tee "$RUNNER_TEMP/fpc-smoke/run.txt"
          grep -F 'FPC 3.2.2 native execution OK' "$RUNNER_TEMP/fpc-smoke/run.txt"

      - name: Export portable native compiler
        shell: bash
        run: |
          set -euxo pipefail
          cid="$(docker create signumtemporis/fpc:3.2.2-full)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker export "$cid" | zstd -T0 -15 -o fpc-3.2.2-linux-x86_64-rootfs.tar.zst
          sha256sum fpc-3.2.2-linux-x86_64-rootfs.tar.zst > fpc-native.sha256

      - name: Upload toolchain artifact
        uses: actions/upload-artifact@v4
        with:
          name: fpc-3.2.2-native-linux-rootfs
          path: |
            fpc-3.2.2-linux-x86_64-rootfs.tar.zst
            fpc-native.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
