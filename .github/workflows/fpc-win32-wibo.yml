name: FPC Native Test Toolchain

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-toolchain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pull FPC 3.2.2 native Linux image
        run: docker pull signumtemporis/fpc:3.2.2-full

      - name: Add native linker and SDL2 development runtime
        shell: bash
        run: |
          set -euxo pipefail
          docker create --name fpc-native-dev \
            --entrypoint /bin/sh \
            signumtemporis/fpc:3.2.2-full \
            -lc 'apk add --no-cache build-base musl-dev sdl2-dev'
          docker start -a fpc-native-dev

      - name: Verify native Pascal execution
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/fpc-smoke"
          cat > "$RUNNER_TEMP/fpc-smoke/hello.pas" <<'PAS'
          program hello;
          begin
            WriteLn('FPC 3.2.2 native execution OK');
          end.
          PAS
          docker commit fpc-native-dev fpc-native-dev:3.2.2
          docker run --rm \
            -v "$RUNNER_TEMP/fpc-smoke:/workspace" \
            fpc-native-dev:3.2.2 \
            hello.pas
          test -x "$RUNNER_TEMP/fpc-smoke/hello"
          "$RUNNER_TEMP/fpc-smoke/hello" | tee "$RUNNER_TEMP/fpc-smoke/run.txt"
          grep -F 'FPC 3.2.2 native execution OK' "$RUNNER_TEMP/fpc-smoke/run.txt"

      - name: Export portable native compiler
        shell: bash
        run: |
          set -euxo pipefail
          docker export fpc-native-dev | zstd -T0 -15 -o fpc-3.2.2-linux-x86_64-dev-rootfs.tar.zst
          sha256sum fpc-3.2.2-linux-x86_64-dev-rootfs.tar.zst > fpc-native-dev.sha256

      - name: Upload toolchain artifact
        uses: actions/upload-artifact@v4
        with:
          name: fpc-3.2.2-native-linux-dev-rootfs
          path: |
            fpc-3.2.2-linux-x86_64-dev-rootfs.tar.zst
            fpc-native-dev.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
